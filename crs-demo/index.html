<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maplibre-gl-js #168 — planar CRS demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(255,255,255,.94); padding: 10px 12px; border-radius: 6px; max-width: 380px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel button { margin: 2px 4px 2px 0; padding: 4px 8px; }
  #panel button.on { font-weight: 700; outline: 2px solid #333; }
  #hud { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; margin-top: 6px; color: #333; }
  #note { margin-top: 6px; color: #444; }
  a { color: #06c; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Planar CRS demo — <a href="https://github.com/maplibre/maplibre-gl-js/issues/168">#168</a> branch</h1>
  <div>
    <button data-demo="identity">identity (image plane)</button>
    <button data-demo="polar">EPSG:3413 polar (NASA GIBS)</button>
    <button data-demo="nz">EPSG:2193 NZ (LINZ)</button>
  </div>
  <div id="note"></div>
  <div>Points are markers: GeoJSON sources do not follow a registered projection yet.</div>
  <div id="hud"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js"></script>
<script type="module">
import * as maplibregl from './maplibre-gl.mjs';

proj4.defs('EPSG:3413', '+proj=stere +lat_0=90 +lat_ts=70 +lon_0=-45 +k=1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs');
proj4.defs('EPSG:2193', '+proj=tmerc +lat_0=0 +lon_0=173 +k=0.9996 +x_0=1600000 +y_0=10000000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');

function crs(name, tileMatrixSet) {
  return {
    name,
    projection: proj4('EPSG:4326', name),
    tileMatrixSet,
  };
}
// NASA GIBS EPSG:3413 tile matrix set: one 8,388,608 m square at zoom 0 (GIBS "level 0" is our zoom 1).
maplibregl.addProjection(crs('EPSG:3413', {origin: [-4194304, 4194304], extentAtZoom0: 8388608}));
// LINZ NZTM2000Quad: numbers from the LINZ TileMatrixSet definition.
maplibregl.addProjection(crs('EPSG:2193', {origin: [-3260586.7284, 10438190.1652], extentAtZoom0: 10018754.1714}));

function gridImage() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 512, 512); grad.addColorStop(0, '#f0b14a'); grad.addColorStop(1, '#5aa0d8');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, 512); g.moveTo(0, i * 64); g.lineTo(512, i * 64); g.stroke(); }
  g.fillStyle = '#222'; g.font = 'bold 26px system-ui';
  g.fillText('[-60, 30]', 12, 34); g.fillText('[60, 30]', 390, 34); g.fillText('[-60, -30]', 12, 500); g.fillText('[60, -30]', 380, 500);
  return c.toDataURL();
}

const gibs = (layers) => `https://gibs.earthdata.nasa.gov/wms/epsg3413/best/wms.cgi?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&SRS=EPSG:3413&BBOX={bbox}&WIDTH=512&HEIGHT=512&FORMAT=image/png&TRANSPARENT=TRUE&LAYERS=${layers}`;
const linzKey = new URLSearchParams(location.search).get('linz');

const demos = {
  identity: {
    note: 'The built-in <code>identity</code> projection: coordinates are plain x/y, no latitude stretch. Drag, scroll-zoom, right-drag to rotate/pitch. The image is placed by its four corners in the same units as the markers.',
    style: {
      version: 8, projection: {type: 'identity'},
      sources: {
        grid: {type: 'image', url: gridImage(), coordinates: [[-60, 30], [60, 30], [60, -30], [-60, -30]]},
      },
      layers: [
        {id: 'bg', type: 'background', paint: {'background-color': '#e9ecef'}},
        {id: 'grid', type: 'raster', source: 'grid'},
      ],
    },
    view: {center: [0, 0], zoom: 1.6},
    markers: [['origin', 0, 0], ['[-60, 30]', -60, 30], ['[60, -30]', 60, -30]],
  },
  polar: {
    note: 'EPSG:3413 (NSIDC polar stereographic), tiles requested from NASA GIBS WMS with the branch\'s <code>{bbox}</code> URL token: Blue Marble base + AMSR2 sea-ice concentration + coastlines. Nothing is reprojected client-side; the map camera lives in the CRS.',
    style: {
      version: 8, projection: {type: 'EPSG:3413'},
      sources: {
        base: {type: 'raster', tiles: [gibs('BlueMarble_ShadedRelief_Bathymetry')], tileSize: 512, maxzoom: 6, attribution: 'NASA GIBS'},
        ice: {type: 'raster', tiles: [gibs('AMSRU2_Sea_Ice_Concentration_12km')], tileSize: 512, maxzoom: 6},
        coast: {type: 'raster', tiles: [gibs('Coastlines')], tileSize: 512, maxzoom: 6},
      },
      layers: [
        {id: 'base', type: 'raster', source: 'base'},
        {id: 'ice', type: 'raster', source: 'ice', paint: {'raster-opacity': .85}},
        {id: 'coast', type: 'raster', source: 'coast'},
      ],
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    },
    view: {center: [-40, 84], zoom: 1.0},
    markers: [['North Pole', 0, 90], ['Longyearbyen', 15.63, 78.22], ['Utqiagvik', -156.79, 71.29], ['Nuuk', -51.72, 64.18]],
  },
  nz: {
    note: linzKey
      ? 'EPSG:2193 (NZTM2000): LINZ Basemaps topographic tiles on the NZTM2000Quad grid, drawn in their native CRS, with city markers placed by lng/lat.'
      : 'EPSG:2193 (NZTM2000, a transverse Mercator): city markers placed by lng/lat. For LINZ topographic tiles on the NZTM2000Quad grid, open this page with <code>?linz=YOUR_KEY</code> (<a href="https://basemaps.linz.govt.nz/" target="_blank">free key</a>).',
    style: {
      version: 8, projection: {type: 'EPSG:2193'},
      sources: {
        ...(linzKey ? {topo: {type: 'raster', tiles: [`https://basemaps.linz.govt.nz/v1/tiles/topographic/NZTM2000Quad/{z}/{x}/{y}.webp?api=${linzKey}`], tileSize: 256, maxzoom: 16, attribution: '© LINZ CC BY 4.0'}} : {}),
      },
      layers: [
        {id: 'bg', type: 'background', paint: {'background-color': '#cfe0ee'}},
        ...(linzKey ? [{id: 'topo', type: 'raster', source: 'topo'}] : []),
      ],
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    },
    view: {center: [172.8, -41.3], zoom: 3.5},
    markers: [['Auckland', 174.76, -36.85], ['Wellington', 174.78, -41.29], ['Christchurch', 172.64, -43.53], ['Dunedin', 170.50, -45.87]],
  },
};

const params = new URLSearchParams(location.search);
let current = params.get('demo') in demos ? params.get('demo') : 'polar';
const map = new maplibregl.Map({container: 'map', style: demos[current].style, ...demos[current].view, hash: false});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));
map.addControl(new maplibregl.ScaleControl());

function hud() {
  const c = map.getCenter();
  document.getElementById('hud').textContent = `projection ${map.getProjection()?.type}\ncenter ${c.lng.toFixed(3)}, ${c.lat.toFixed(3)}  zoom ${map.getZoom().toFixed(2)}  bearing ${map.getBearing().toFixed(0)}  pitch ${map.getPitch().toFixed(0)}`;
}
let markers = [];
function placeMarkers() {
  for (const marker of markers) marker.remove();
  markers = demos[current].markers.map(([label, lng, lat]) => new maplibregl.Marker().setLngLat([lng, lat]).setPopup(new maplibregl.Popup({offset: 25}).setText(label)).addTo(map));
}
function select(name) {
  current = name;
  placeMarkers();
  for (const b of document.querySelectorAll('#panel button')) b.classList.toggle('on', b.dataset.demo === name);
  document.getElementById('note').innerHTML = demos[name].note;
  history.replaceState(null, '', `?demo=${name}${linzKey ? `&linz=${linzKey}` : ''}`);
}
for (const b of document.querySelectorAll('#panel button')) b.onclick = () => {
  select(b.dataset.demo);
  map.setStyle(demos[current].style);
  map.jumpTo(demos[current].view);
};
select(current);
map.on('move', hud); map.on('load', hud);
map.on('click', (e) => console.log('click', e.lngLat.toArray(), map.project(e.lngLat)));
map.once('idle', () => { window.__demoReady = true; });
window.map = map; window.maplibregl = maplibregl;
</script>
</body>
</html>
