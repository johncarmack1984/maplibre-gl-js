<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>mapeak terrain, main + #8368 + #8369 + single-stack style</title>
<link rel="stylesheet" href="./dist-improved/maplibre-gl.css">
<style>html,body{margin:0;height:100%;background:#000}#map{position:absolute;inset:0}#tag{position:absolute;left:8px;top:8px;padding:4px 8px;background:rgba(0,0,0,.6);color:#fff;font:12px -apple-system,system-ui,sans-serif;border-radius:4px;pointer-events:none}#tag b{color:#7fdc7f;margin-left:6px}#other{position:absolute;right:8px;top:8px;padding:4px 8px;background:rgba(0,0,0,.6);color:#9cf;font:12px -apple-system,system-ui,sans-serif;border-radius:4px;text-decoration:none}</style>
</head><body><div id="map"></div><div id="tag">main + #8368 + #8369 + single-stack style<b id="fps"></b></div><a id="other" href="./main.html">main build</a>
<script type="module">
import {Map, Marker, setRTLTextPlugin} from './dist-improved/maplibre-gl.mjs';
const q = new URLSearchParams(location.search);
setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js', true);
const style = await (await fetch(q.get('style') || './mapeak-style-single-stack.json')).json();
for (const s of Object.values(style.sources)) if (s.tiles) s.tiles = s.tiles.map(u => u.replace(/^slice:\/\//, 'https://'));
const dem = Object.entries(style.sources).find(([, s]) => s.type === 'raster-dem')?.[0];
if (dem && !q.has('noterrain')) style.terrain = {source: dem, exaggeration: 1};
const center = (q.get('center') || '35.05,32.72').split(',').map(Number);
const map = window.map = new Map({container: 'map', style, center, zoom: +(q.get('zoom') || 12.5), pitch: +(q.get('pitch') || 30), maxPitch: 85, attributionControl: false});
map.on('error', e => console.error(e.error || e));
// ?markers=N drops N default DOM markers spread over the view (a stand-in for the app's clustered POI markers; they move with the map and check terrain occlusion like any Marker)
const markers = +(q.get('markers') || 0);
if (markers) map.once('load', () => {
    const w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
    const cols = Math.ceil(Math.sqrt(markers * w / h)), rows = Math.ceil(markers / cols);
    for (let i = 0; i < markers; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        new Marker().setLngLat(map.unproject([w * (c + 0.5) / cols, h * (0.12 + 0.86 * (r + 0.5) / rows)])).addTo(map);
    }
    document.getElementById('tag').firstChild.textContent += ` + ${markers} markers`;
});
// frames per second while the map moves (requestAnimationFrame cadence), blank at rest
const fps = document.getElementById('fps'); let frames = 0, t0 = performance.now(), moving = false;
map.on('movestart', () => { moving = true; }); map.on('moveend', () => { moving = false; fps.textContent = ''; });
(function tick(t) { frames++; if (t - t0 >= 1000) { if (moving) fps.textContent = frames + ' fps'; frames = 0; t0 = t; } requestAnimationFrame(tick); })(performance.now());
</script></body></html>
