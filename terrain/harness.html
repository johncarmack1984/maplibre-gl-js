<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" id="vp" content="width=device-width, initial-scale=1, maximum-scale=1">
<script>if (new URLSearchParams(location.search).get("desktop")) document.getElementById("vp").setAttribute("content", "width=980");</script><title>terrain mobile harness</title>
<style>html,body{margin:0;height:100%;background:#000;color:#0f0;font:12px/1.3 -apple-system,Menlo,monospace}#map{position:absolute;inset:0}#hud{position:absolute;left:0;right:0;bottom:0;max-height:45%;overflow:auto;background:rgba(0,0,0,.75);padding:6px;white-space:pre;z-index:9}</style>
</head><body><div id="map"></div><div id="hud">loading...</div>
<script type="module">
const q = new URLSearchParams(location.search);
const hud = document.getElementById('hud'); const log = (s) => { hud.textContent += '\n' + s; hud.scrollTop = 1e9; };
window.onerror = (m, s, l) => log('ERROR ' + m + ' @' + l); window.onunhandledrejection = (e) => log('REJECT ' + (e.reason?.message || e.reason));
const src = q.get('src') || '6.7.0';
let Map, getVersion;
if (q.get('profile')) window.__terrainProfile = {};
if (src === 'main') ({Map, getVersion} = await import('./dist-main/maplibre-gl-dev.mjs'));
else if (src.startsWith('telemetry')) ({Map, getVersion} = await import(`./dist-${src}/maplibre-gl-dev.mjs`));
else ({Map, getVersion} = await import(`./dist-${src}/maplibre-gl.mjs`));
const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = './maplibre-gl.css'; document.head.appendChild(link);
hud.textContent = `maplibre ${getVersion()} (terrain harness) | ${navigator.userAgent.slice(0, 80)} | dpr ${devicePixelRatio} | ${innerWidth}x${innerHeight}`;
let style;
try { const r = await fetch('./mapeak-style.json'); if (!r.ok) throw new Error(r.status); style = await r.json(); log('style: mapeak'); }
catch { log('style: fallback (demotiles + terrain-tiles), mapeak-style.json not captured yet');
    style = {version: 8, sources: {basemap: {type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19},
        terrain: {type: 'raster-dem', url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json', tileSize: 256}},
        layers: [{id: 'basemap', type: 'raster', source: 'basemap'}, {id: 'hills', type: 'hillshade', source: 'terrain'}], terrain: {source: 'terrain', exaggeration: 1}}; }
// plain https tiles: the site serves its slice variant over http with ?use=slice as well as via the slice:// protocol
for (const s of Object.values(style.sources)) if (s.tiles) s.tiles = s.tiles.map(u => u.replace(/^slice:\/\//, 'https://'));
// mapeak enables terrain at runtime (the style ships none); the harness turns it on unless ?noterrain=1
const demSource = Object.entries(style.sources).find(([, s]) => s.type === 'raster-dem')?.[0];
if (q.get('noterrain')) delete style.terrain; else if (!style.terrain && demSource) style.terrain = {source: demSource, exaggeration: +(q.get('exaggeration') || 1)};
log('terrain: ' + (style.terrain ? JSON.stringify(style.terrain) : 'off'));
const center = (q.get('center') || '35.05,32.72').split(',').map(Number); const zoom = +(q.get('zoom') || 12);
const map = window.map = new Map({container: 'map', style, center, zoom, pitch: +(q.get('pitch') || 60), bearing: 0, maxPitch: 85, attributionControl: false});
map.on('error', e => log('map error: ' + (e.error?.message || JSON.stringify(e))));

// frame timing: rAF deltas while a phase runs, plus map render count
let frames = [], renders = 0, last = 0, running = false, longFrames = [], tileEvents = [];
map.on('render', () => { renders++; });
map.on('data', e => { if (running && e.tile) tileEvents.push({t: performance.now(), src: e.sourceId, z: e.coord?.canonical?.z}); });
function tick(t) { if (running) { if (last) { const d = t - last; frames.push(d); if (d > 33) longFrames.push({t, d, zoom: +map.getZoom().toFixed(2)}); } last = t; } requestAnimationFrame(tick); } requestAnimationFrame(tick);
const pct = (a, p) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
function profileStats(fromFrame) {
    const P = window.__terrainProfile; if (!P || !P.frames) return undefined;
    const fr = P.frames.filter(r => r.frame > fromFrame && r.pendingQueries === 0);
    const pctOf = (arr, p) => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2); };
    const col = (k, sub) => fr.map(r => sub ? r[k][sub] : r[k]);
    const out = {frames: fr.length, gpuTimer: !!P.hasGpuTimer, disjoint: fr.filter(r => r.disjoint).length,
        cpuRender: {p50: pctOf(col('cpuRender'), .5), p90: pctOf(col('cpuRender'), .9), max: pctOf(col('cpuRender'), 1)},
        redrapes: {total: fr.reduce((a, r) => a + r.redrapes, 0), framesWith: fr.filter(r => r.redrapes > 0).length, max: Math.max(0, ...col('redrapes'))},
        depthDraws: fr.reduce((a, r) => a + r.depthDraws, 0), rttTilesPerFrame: pctOf(col('rttTiles'), .5)};
    for (const region of ['depth', 'rtt', 'terrain']) {
        out['gpu_' + region] = {p50: pctOf(col('gpu', region), .5), p90: pctOf(col('gpu', region), .9), max: pctOf(col('gpu', region), 1)};
        out['cpu_' + region] = {p50: pctOf(col('cpu', region), .5), p90: pctOf(col('cpu', region), .9), max: pctOf(col('cpu', region), 1)};
    }
    return out;
}
function stats(label, ms) { const f = frames;
    // for every long frame: how many tiles arrived during it, and from which sources
    const hitches = longFrames.map(({t, d, zoom}) => { const during = tileEvents.filter(e => e.t >= t - d - 20 && e.t <= t + 5); return {d: +d.toFixed(1), zoom, tiles: during.length, sources: [...new Set(during.map(e => e.src))], zs: [...new Set(during.map(e => e.z))]}; });
    return {label, ms, frames: f.length, renders, tilesLoaded: tileEvents.length, p50: +pct(f, .5).toFixed(1), p90: +pct(f, .9).toFixed(1), p99: +pct(f, .99).toFixed(1), max: +Math.max(0, ...f).toFixed(1), over33: f.filter(x => x > 33).length, over50: f.filter(x => x > 50).length, over100: f.filter(x => x > 100).length, hitches}; }
async function phase(label, ms, fn) { frames = []; renders = 0; last = 0; longFrames = []; tileEvents = []; running = true; const profileFrom = window.__terrainProfile?.profiler?.frame ?? 0; const t0 = performance.now(); await fn(); await new Promise(r => setTimeout(r, Math.max(0, ms - (performance.now() - t0)))); running = false; const s = stats(label, Math.round(performance.now() - t0)); if (window.__terrainProfile) { await new Promise(r => setTimeout(r, 300)); map.triggerRepaint(); await new Promise(r => setTimeout(r, 100)); s.profile = profileStats(profileFrom); } results.phases.push(s); log(`${label}: ${s.frames}f p50 ${s.p50} p90 ${s.p90} p99 ${s.p99} max ${s.max} >33:${s.over33} >50:${s.over50} >100:${s.over100} renders ${s.renders} tiles ${s.tilesLoaded}` + (s.profile ? ` | gpu depth ${s.profile.gpu_depth.p50}/${s.profile.gpu_depth.max} rtt ${s.profile.gpu_rtt.p50}/${s.profile.gpu_rtt.max} terrain ${s.profile.gpu_terrain.p50}/${s.profile.gpu_terrain.max} cpuRender ${s.profile.cpuRender.p50}/${s.profile.cpuRender.max} redrapes ${s.profile.redrapes.total} in ${s.profile.redrapes.framesWith}f depthDraws ${s.profile.depthDraws}` : '') + (s.hitches.length ? ' hitches ' + s.hitches.map(h => `${h.d}ms@z${h.zoom}/${h.tiles}t`).join(' ') : '')); }
const idle = (ms = 15000) => new Promise(r => { const t = setTimeout(() => { log(`idle timeout ${ms}ms: loaded=${map.loaded()} tilesLoaded=${map.areTilesLoaded()}`); r(); }, ms); map.once('idle', () => { clearTimeout(t); r(); }); });
map.on('sourcedata', e => { if (e.sourceDataType === 'metadata') log('source ready: ' + e.sourceId); });
map.on('styleimagemissing', e => log('missing image: ' + e.id));
const results = {label: q.get('label') || src, version: getVersion(), ua: navigator.userAgent, dpr: devicePixelRatio, size: [innerWidth, innerHeight], terrain: !!style.terrain, center, zoom, phases: []};
await new Promise(r => map.once('load', r)); log('loaded, waiting for idle (max 30s)'); await idle(30000); log('start phases');
const canvas = map.getCanvas();
function dragPan(dx, dy, ms) {
    // one finger, moved every frame through the touch handlers (maplibre listens to touch and mouse events, not pointer events)
    return new Promise(resolve => {
        const r = canvas.getBoundingClientRect(); const x0 = r.left + r.width / 2 - dx / 2, y0 = r.top + r.height / 2 - dy / 2;
        const touch = (x, y) => new Touch({identifier: 1, target: canvas, clientX: x, clientY: y, pageX: x, pageY: y, screenX: x, screenY: y, radiusX: 8, radiusY: 8, force: 1});
        const ev = (type, x, y) => { const t = touch(x, y); canvas.dispatchEvent(new TouchEvent(type, {touches: type === 'touchend' ? [] : [t], targetTouches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true, cancelable: true})); };
        const t0 = performance.now(); ev('touchstart', x0, y0);
        const step = () => { const t = Math.min(1, (performance.now() - t0) / ms); ev('touchmove', x0 + dx * t, y0 + dy * t); if (t < 1) requestAnimationFrame(step); else { ev('touchend', x0 + dx, y0 + dy); let done = false; const finish = () => { if (!done) { done = true; resolve(); } }; map.once('moveend', finish); setTimeout(finish, 2000); } };
        requestAnimationFrame(step);
    });
}
const DRAG = q.get('drag');
if (q.get('gesture') === 'pan30') {
    const gesturePitch = +(q.get('gpitch') || 30);
    map.jumpTo({pitch: gesturePitch, zoom, center});
    log(`gesture pan30: pitch ${gesturePitch}, ${DRAG ? 'touch drags (synthetic pointer events)' : 'easeTo'}, layout ${innerWidth}x${innerHeight} css px, dpr ${devicePixelRatio}`);
    await idle();
    await phase('idle-3s', 3000, async () => {});
    await phase('pan30-east-8s', 8500, () => DRAG ? dragPan(-innerWidth * 0.8, 0, 8000) : new Promise(r => { map.easeTo({center: [center[0] + 0.08, center[1]], duration: 8000, easing: t => t}); map.once('moveend', r); }));
    await phase('pan30-north-8s', 8500, () => DRAG ? dragPan(0, innerHeight * 0.6, 8000) : new Promise(r => { map.easeTo({center: [center[0] + 0.08, center[1] + 0.05], duration: 8000, easing: t => t}); map.once('moveend', r); }));
    await idle();
    await phase('pan30-back-8s', 8500, () => DRAG ? dragPan(innerWidth * 0.8, -innerHeight * 0.6, 8000) : new Promise(r => { map.easeTo({center, duration: 8000, easing: t => t}); map.once('moveend', r); }));
    await idle();
    map.jumpTo({zoom: zoom + 2}); await idle();
    await phase('pan30-z14-east-8s', 8500, () => DRAG ? dragPan(-innerWidth * 0.8, 0, 8000) : new Promise(r => { map.easeTo({center: [center[0] + 0.03, center[1]], duration: 8000, easing: t => t}); map.once('moveend', r); }));
    log('DONE. Summary below (screenshot this):'); for (const ph of results.phases) { const q = ph.profile; log(`${ph.label}: frame p50 ${ph.p50} p90 ${ph.p90} max ${ph.max} ms, over 33 ms: ${ph.over33}` + (q ? ` | GPU terrain ${q.gpu_terrain.p50}/${q.gpu_terrain.max} depth ${q.gpu_depth.max} drape max ${q.gpu_rtt.max} (${q.redrapes.total} drapes) cpu ${q.cpuRender.p50}` : '')); } log('device: ' + navigator.userAgent); log('gpu timer: ' + (window.__terrainProfile?.hasGpuTimer ?? 'n/a'));
    window.results = results;
} else {
await phase('idle-3s', 3000, async () => {});
await phase('pan-east-4s', 4500, () => new Promise(r => { map.easeTo({center: [center[0] + 0.05, center[1]], duration: 4000, easing: t => t}); map.once('moveend', r); }));
await phase('pan-north-4s', 4500, () => new Promise(r => { map.easeTo({center: [center[0] + 0.05, center[1] + 0.03], duration: 4000, easing: t => t}); map.once('moveend', r); }));
await idle();
await phase('zoom-within-level-4s', 4500, () => new Promise(r => { map.easeTo({zoom: Math.floor(zoom) + 0.2, duration: 300}); map.once('moveend', () => { map.easeTo({zoom: Math.floor(zoom) + 0.85, duration: 4000, easing: t => t}); map.once('moveend', r); }); }));
await idle();
await phase('zoom-cross-level-4s', 4500, () => new Promise(r => { map.easeTo({zoom: Math.floor(zoom) + 0.7, duration: 300}); map.once('moveend', () => { map.easeTo({zoom: Math.floor(zoom) + 1.35, duration: 4000, easing: t => t}); map.once('moveend', r); }); }));
await idle();
await phase('zoom-cross-x3-9s', 9500, async () => { const lo = Math.floor(zoom) + 0.7, hi = Math.floor(zoom) + 1.35; for (let i = 0; i < 3; i++) { await new Promise(r => { map.easeTo({zoom: hi, duration: 1500, easing: t => t}); map.once('moveend', r); }); await new Promise(r => { map.easeTo({zoom: lo, duration: 1500, easing: t => t}); map.once('moveend', r); }); } });
await idle();
await phase('zoom-in-1.5-4s', 4500, () => new Promise(r => { map.easeTo({zoom: zoom + 1.5, duration: 4000, easing: t => t}); map.once('moveend', r); }));
await idle();
await phase('zoom-out-3-4s', 4500, () => new Promise(r => { map.easeTo({zoom: zoom - 1.5, duration: 4000, easing: t => t}); map.once('moveend', r); }));
await idle();
await phase('pitch-0-to-75-3s', 3500, () => new Promise(r => { map.easeTo({pitch: 75, duration: 3000, easing: t => t}); map.once('moveend', r); }));
await phase('rotate-90-4s', 4500, () => new Promise(r => { map.easeTo({bearing: 90, duration: 4000, easing: t => t}); map.once('moveend', r); }));
await idle();
await phase('flyTo-far-5s', 5500, () => new Promise(r => { map.flyTo({center: [center[0] + 1.5, center[1] + 0.8], zoom: zoom, pitch: 60, bearing: 0, duration: 5000}); map.once('moveend', r); }));
await idle();
log('DONE. Summary below (screenshot this):'); for (const ph of results.phases) { const q = ph.profile; log(`${ph.label}: frame p50 ${ph.p50} p90 ${ph.p90} max ${ph.max} ms, over 33 ms: ${ph.over33}` + (q ? ` | GPU terrain ${q.gpu_terrain.p50}/${q.gpu_terrain.max} depth ${q.gpu_depth.max} drape max ${q.gpu_rtt.max} (${q.redrapes.total} drapes) cpu ${q.cpuRender.p50}` : '')); } log('device: ' + navigator.userAgent); log('gpu timer: ' + (window.__terrainProfile?.hasGpuTimer ?? 'n/a'));
window.results = results;
}
</script></body></html>
